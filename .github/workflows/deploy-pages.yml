name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      # Only docs/ is uploaded, so brief.md, reference/ and images/ are never
      # served — the same deploy-root guarantee the GitHub Pages workflow gave.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=nomad-twin-towers --branch=main
